name: Clinical AI Pipeline & Compliance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision numpy scipy pydantic ruff bandit

      - name: Code Quality & Security Scan
        run: |
          ruff check src demo
          bandit -r src -ll -ii

      - name: Execute Pipeline Smoke Test
        run: |
          python demo/pipeline.py
